name: unify-triage
description: |
  Triage of one request (stage 1): trust check, Triaging, the Triage agent with raw
  evidence for every claim, then the Operator's Accept card in TriageReview. Accept
  starts the spec (M, L) or the first implementation round (S); for a human and won't do
  end here. An "other" answer is a ruling (a corrected size or risk) and triage runs
  again with it.

  Use when: unify-poll fires it on issue-<n>.
  NOT for: writing a spec (unify-spec) or implementing (unify-round).

inputs:
  repo_host:
    default: ""
    description: The forge host of the repository the pipeline works.
  repo_path:
    default: ""
    description: The owner/name path of that repository.
  number:
    required: true
    description: The issue number of the item.
  unify_spec_binding:
    default: ""
    description: Absolute path of the unify-spec binding file; apply starts the spec through it.
  unify_round_binding:
    default: ""
    description: Absolute path of the unify-round binding file; apply starts an S item's round through it.

# Agents read the launch checkout; scripts write only through the forge.
worktree: { enabled: false }
mutates_checkout: false

nodes:
  - id: reconcile
    script: reconcile
    runtime: bun
    timeout: 120000
    output_format: &card
      type: object
      properties: &card_props
        ok: { type: boolean }
        reason: { type: string }
        question: { type: string }
        options: &options
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              does: { type: string }
              value: { type: object }
            required: [id, label, does, value]
        recommendation: &recommendation
          type: object
          properties:
            option: { type: string }
            why: { type: string }
            confidence: { type: string, enum: [low, medium, high] }
          required: [option, why, confidence]
        state: { type: string }
      required: [ok, reason, question, options, recommendation, state]

  - id: trust
    script: trust
    runtime: bun
    timeout: 120000
    depends_on: [reconcile]
    when: "$reconcile.output.ok == 'true'"
    output_format:
      type: object
      properties:
        proceed: { type: boolean }
        author: { type: string }
        reason: { type: string }
      required: [proceed, author, reason]

  # SPEC's "state Triaging", joined with reconcile so one stop request covers both.
  - id: enter
    script: enter
    runtime: bun
    timeout: 120000
    depends_on: [reconcile, trust]
    trigger_rule: none_failed_min_one_success
    with:
      reconcile: { from: "$reconcile.output" }
      trust: { from: "$trust.output", if_skipped: null }
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        reason: { type: string }
        question: { type: string }
        options: *options
        recommendation: *recommendation
        go: { type: boolean }
        ask: { type: boolean }
      required: [ok, reason, question, options, recommendation, go, ask]

  # The item is not where triage starts: ask, never triage over it.
  - id: stop
    depends_on: [enter]
    when: "$enter.output.ask == 'true'"
    wait:
      attention: "$enter.output.question"
      form: select
      options: "$enter.output.options"
      recommendation: "$enter.output.recommendation"
      other: true
      labels: { gate: stop, stage: triage, item: "$INPUTS.number" }

  - id: gather
    script: gather
    runtime: bun
    timeout: 300000
    depends_on: [enter]
    when: "$enter.output.go == 'true'"
    output_format:
      type: object
      properties:
        context: { type: string }
      required: [context]

  # One round: the verdict, its evidence check, the card, the Operator's answer. "other"
  # (a corrected size or risk) runs another round with that text as a ruling.
  - id: review
    depends_on: [enter, gather, stop]
    trigger_rule: none_failed_min_one_success
    when: "$enter.output.go == 'true'"
    loop_group:
      max_iterations: 3
      until_bash: 'd=$accept.output.decision; [ "$d" != other ]'
      nodes:
        - id: prev-ruling
          script: prev-ruling
          runtime: bun
          timeout: 120000
          with:
            prev_decision: "$LOOP_PREV.accept.output.decision"
            prev_text: "$LOOP_PREV.accept.output.text"
          output_format:
            type: object
            properties:
              correction: { type: string }
            required: [correction]

        - id: triage
          command: triage
          depends_on: [prev-ruling]
          model: ['@triage', medium]
          context: fresh
          idle_timeout: 600000
          maxBudgetUsd: 3
          with:
            context: "$gather.output.context"
            correction: "$prev-ruling.output.correction"
          output_format:
            type: object
            additionalProperties: false
            properties:
              kind: { type: string, enum: [bug, feature, chore, question] }
              size: { type: string, enum: [S, M, L] }
              risk: { type: string, enum: [R0, R1, R2] }
              outcome: { type: string, enum: [accept, for-human, wont-do] }
              reason: { type: string }
              confidence: { type: string, enum: [low, medium, high] }
              claims:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    kind: { type: string, enum: [duplicate, already-built, rejected-before, reproduced, refuted, root-cause, other] }
                    statement: { type: string }
                    link: { type: [string, 'null'] }
                    quote: { type: [string, 'null'] }
                    command: { type: [string, 'null'] }
                    output: { type: [string, 'null'] }
                    file_line: { type: [string, 'null'] }
                  required: [kind, statement, link, quote, command, output, file_line]
              root_cause:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    file_line: { type: string }
                    explanation: { type: string }
                  required: [file_line, explanation]
              duplicates:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    url: { type: string }
                    quote: { type: string }
                    relation: { type: string, enum: [duplicate, already-built, rejected-before, related] }
                  required: [url, quote, relation]
              assumptions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    text: { type: string }
                    source: { type: string }
                  required: [text, source]
              data_sources: { type: string }
            required: [kind, size, risk, outcome, reason, confidence, claims, root_cause, duplicates, assumptions, data_sources]

        - id: evidence
          script: evidence
          runtime: bun
          timeout: 60000
          depends_on: [triage]
          with:
            verdict: "$triage.output"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              verdict: { type: object }
            required: [ok, problems, verdict]

        - id: card
          script: card
          runtime: bun
          timeout: 120000
          depends_on: [evidence]
          with:
            evidence: "$evidence.output"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              reason: { type: string }
              question: { type: string }
              options: *options
              recommendation: *recommendation
              size: { type: string, enum: [S, M, L] }
              risk: { type: string }
              outcome: { type: string }
              verdict_reason: { type: string }
              problems: { type: array, items: { type: string } }
            required: [ok, reason, question, options, recommendation, size, risk, outcome, verdict_reason, problems]

        # The Accept gate: the body's only sink. The run pauses here and releases its slot.
        - id: accept
          depends_on: [card]
          wait:
            attention: "$card.output.question"
            form: select
            options: "$card.output.options"
            recommendation: "$card.output.recommendation"
            other: true
            labels: { gate: accept, stage: triage, item: "$INPUTS.number" }

  - id: apply
    script: apply
    runtime: bun
    timeout: 300000
    depends_on: [review]
    with:
      card: "$review.output"
    output_format:
      type: object
      properties:
        effect: { type: string, enum: [accept, for-human, wont-do, stop] }
        fired: { type: string }
        summary: { type: string }
      required: [effect, fired, summary]

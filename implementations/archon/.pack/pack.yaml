# The unify-sdlc pack: settings, the forge operations its scripts call, and the
# trigger bindings. A project sets the settings in `.archon/packs/redikultsev.unify-sdlc.yaml`
# under `settings:`. Nothing here starts a run: the Operator writes the binding files once
# with `archon pack bindings` (see ../SPEC.md, "Settings and setup per project").

inputs:
  base:
    type: string
    default: main
    description: >-
      The branch changes merge into and policy is read from (`.pipeline/*` on it, never on
      an item's branch).
  implement_lane:
    type: enum
    values: [auto, manual]
    default: auto
    description: >-
      auto: an accepted item starts implementing by itself. manual: every Implementer start
      is a decision request with a recommendation (decision 40).
  merge_lane:
    type: enum
    values: [auto, manual]
    default: manual
    description: >-
      auto: a PR the auto-merge rules match merges without the Operator (R0). manual: every
      PR goes to the Merge gate (decision 40). Starts manual until the rules are measured.
  intake_label:
    type: string
    default: ""
    description: >-
      When set, the poll takes only open issues carrying this label (set by the Operator),
      so the pipeline works a chosen set on a busy repository. Empty: every new issue.
  review_family:
    type: enum
    values: [strict, same-allowed]
    default: strict
    description: >-
      strict: the AI reviewer must be another model family than the Implementer, or the
      item waits on "review unavailable" (decision 22). same-allowed: a same-family review
      runs and the merge card carries the flag review-same-family, which also keeps the PR
      off the R0 path. A stopgap until a second family is connected.
  pipeline_login:
    type: string
    default: ""
    description: >-
      The forge login the pipeline acts as. Its approval comments count; a marker in any
      other untrusted comment is ignored.

forge:
  repository: { host: repo_host, path: repo_path }
  operations:
    - workitem.view
    - workitem.list
    - workitem.comments
    - workitem.create
    - workitem.close
    - workitem.comment.upsert
    - workitem.label.add
    - workitem.label.remove
    - repo.label.ensure
    - repo.file
    - pr.view
    - pr.create
    - pr.edit-body
    - pr.ready
    - pr.draft
    - pr.files
    - pr.merge
    - pr.merge-state
    - pr.threads
    - pr.thread.reply
    - checks.state
    - checks.commit

# Chain bindings (fire-only) use overlap: queue, so a fire from a run that is still ending
# waits for it instead of being dropped. Timers use overlap: skip. Each binding passes the
# paths of the bindings its workflow may fire as `<name>_binding` inputs.
bindings:
  unify-poll:
    workflow: unify-poll
    resource: intake
    capacity: 1
    overlap: skip
    schedule: { interval_seconds: 300 }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      unify_triage_binding: { binding: unify-triage }

  unify-triage:
    workflow: unify-triage
    resource: triage
    capacity: 5
    overlap: queue
    item: { field: number, prefix: issue- }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      unify_spec_binding: { binding: unify-spec }
      unify_round_binding: { binding: unify-round }

  unify-spec:
    workflow: unify-spec
    resource: spec
    capacity: 5
    overlap: queue
    item: { field: number, prefix: issue- }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      unify_plan_binding: { binding: unify-plan }

  unify-plan:
    workflow: unify-plan
    resource: plan
    capacity: 5
    overlap: queue
    item: { field: number, prefix: issue- }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      unify_round_binding: { binding: unify-round }

  unify-round:
    workflow: unify-round
    resource: round
    capacity: 3
    overlap: queue
    isolation: { kind: worktree }
    item: { field: number, prefix: issue- }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      unify_round_binding: { binding: unify-round }
      unify_plan_binding: { binding: unify-plan }
      unify_merge_binding: { binding: unify-merge }

  unify-merge:
    workflow: unify-merge
    resource: merge
    capacity: 1
    overlap: queue
    item: { field: number, prefix: issue- }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      unify_round_binding: { binding: unify-round }
      unify_plan_binding: { binding: unify-plan }
      unify_merge_binding: { binding: unify-merge }
      unify_deploy_binding: { binding: unify-deploy }

  unify-deploy:
    workflow: unify-deploy
    resource: deploy
    capacity: 1
    overlap: queue
    item: { field: number, prefix: issue- }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      unify_merge_binding: { binding: unify-merge }

  unify-revisit:
    workflow: unify-revisit
    resource: revisit
    overlap: skip
    schedule: { interval_seconds: 900 }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }

  unify-retro:
    workflow: unify-retro
    resource: retro
    overlap: skip
    schedule: { interval_seconds: 604800 }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }

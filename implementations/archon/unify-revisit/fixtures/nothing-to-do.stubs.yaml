# A quiet pass: no Blocked item has a closed blocker, nothing is orphaned, every item reads.
blocked: { checked: 1, notified: [], errors: [] }
orphans: { orphans: [], stopped: [], cost_unknown: [], errors: [] }
stale: { checked: 4, failing: [], set_aside: [], restored: [], errors: [] }
holds: { freed: [], left: [], started: [], unflagged: [], errors: [] }
fixture:

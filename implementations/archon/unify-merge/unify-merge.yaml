name: unify-merge
description: |
  The merge of one work item's PR (SPEC "Workflows", unify-merge). A revert the deploy
  step opened (`revert-pr:<m>` in `work/<n>` flags) merges with no gate, still through
  land's head, update and CI checks (decision 26). Otherwise R0 is decided by
  facts read from the base (`.pipeline/automerge.yaml`, the guard's flags, the merge_lane
  setting, never-zones, working hours, the revert kill switch); anything else waits at the
  Merge gate with the head SHA on the card. Landing updates the PR on the latest base,
  waits for CI, re-checks that every verdict holds at the diff fingerprint, merges pinned
  to the head and reads it back. It fires deploy, or a round on "changes", a conflict or
  red. Started through its binding, which sets `resource: merge` with capacity 1.

  Use when: unify-round fires it after a pass with no slices left, on one item.
  NOT for: verifying a PR (unify-round) or deploying (unify-deploy).

inputs:
  repo_host:
    description: The forge host of the item's repository.
  repo_path:
    description: The owner/name path of the item's repository.
  number:
    description: "The item's key: an issue number or a tracker key such as PROJ-123."
  unify_round_binding:
    default: ""
    description: Absolute path of the binding file that starts unify-round.
  unify_plan_binding:
    default: ""
    description: Absolute path of the binding file that starts unify-plan.
  unify_deploy_binding:
    default: ""
    description: Absolute path of the binding file that starts unify-deploy.
  unify_merge_binding:
    default: ""
    description: >-
      Absolute path of the binding file that starts unify-merge itself, for a new card
      after the head moved with the same diff. Empty: such a case starts a round instead.

# Reads the forge and fetches refs; never edits the checkout.
worktree:
  enabled: false
mutates_checkout: false

nodes:
  - id: reconcile
    script: reconcile
    runtime: bun
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        state: { type: string }
        problems: { type: array, items: { type: string } }
        ask: { type: boolean }
        question: { type: string }
        options: &options
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              does: { type: string }
              value: { type: object }
            required: [id, label, does, value]
        recommendation: { type: [object, 'null'] }
      required: [ok, state, problems, ask, question, options, recommendation]

  - id: reconcile-ask
    depends_on: [reconcile]
    when: "$reconcile.output.ask == 'true'"
    wait:
      attention: "$reconcile.output.question"
      form: select
      options: "$reconcile.output.options"
      other: true
      recommendation: "$reconcile.output.recommendation"
      labels: { gate: reconcile, stage: merge, kind: reconcile, item: "$INPUTS.number" }

  - id: reconcile-ruling
    script: reconcile-ruling
    runtime: bun
    depends_on: [reconcile, reconcile-ask]
    trigger_rule: none_failed_min_one_success
    with:
      reconcile: { from: "$reconcile.output" }
      answer: { from: "$reconcile-ask.output", if_skipped: null }
    output_format:
      type: object
      properties: { go: { type: boolean } }
      required: [go]

  - id: rules
    script: rules
    runtime: bun
    depends_on: [reconcile-ruling]
    when: "$reconcile-ruling.output.go == 'true'"
    output_format:
      type: object
      properties:
        path: { type: string, enum: [r0, gate, stale, revert] }
        r0: { type: boolean }
        reasons: { type: array, items: { type: string } }
        pr: { type: integer }
        head: { type: string }
        fingerprint: { type: string }
        stale: { type: array, items: { type: string } }
        ask: { type: boolean }
        question: { type: string }
        options: *options
        recommendation: { type: [object, 'null'] }
      required: [path, r0, reasons, pr, head, fingerprint, stale, ask, question, options, recommendation]

  - id: merge-review
    script: merge-review
    runtime: bun
    depends_on: [rules]
    when: "$rules.output.path == 'gate'"
    output_format:
      type: object
      properties: { state: { type: string } }
      required: [state]

  # The head SHA is in the merge option's `does` (the console shows it) and its `value`
  # (the ruling script checks it).
  - id: merge-gate
    depends_on: [rules, merge-review]
    wait:
      attention: "$rules.output.question"
      form: select
      options: "$rules.output.options"
      other: true
      recommendation: "$rules.output.recommendation"
      labels: { gate: merge-gate, stage: merge, kind: merge-gate, item: "$INPUTS.number", pr: "$rules.output.pr" }

  - id: ruling
    script: ruling
    runtime: bun
    depends_on: [rules, merge-gate]
    trigger_rule: none_failed_min_one_success
    with:
      rules: { from: "$rules.output" }
      answer: { from: "$merge-gate.output", if_skipped: null }
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [merge, changes, back-to-plan, stale, hold] }
        pr: { type: integer }
        head: { type: string }
        fingerprint: { type: string }
        operator: { type: boolean }
        revert: { type: boolean }
      required: [decision, pr, head, fingerprint, operator, revert]

  - id: land
    script: land
    runtime: bun
    depends_on: [ruling]
    when: "$ruling.output.decision == 'merge'"
    timeout: 10800000
    with:
      ruling: { from: "$ruling.output" }
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [merged, conflict, red, moved, stale, new-card, stuck] }
        head: { type: string }
        detail: { type: string }
        merge_commit: { type: [string, 'null'] }
        attempts: { type: integer }
        ask: { type: boolean }
        question: { type: string }
        options: *options
        recommendation: { type: [object, 'null'] }
      required: [outcome, head, detail, merge_commit, attempts, ask, question, options, recommendation]

  - id: land-ask
    depends_on: [land]
    when: "$land.output.ask == 'true'"
    wait:
      attention: "$land.output.question"
      form: select
      options: "$land.output.options"
      other: true
      recommendation: "$land.output.recommendation"
      labels: { gate: land-stuck, stage: merge, kind: land-stuck, item: "$INPUTS.number" }

  - id: next
    script: next
    runtime: bun
    depends_on: [ruling, land, land-ask]
    trigger_rule: none_failed_min_one_success
    with:
      ruling: { from: "$ruling.output" }
      land: { from: "$land.output", if_skipped: null }
      answer: { from: "$land-ask.output", if_skipped: null }
    output_format:
      type: object
      properties: { did: { type: string } }
      required: [did]

name: unify-retro
description: |
  The weekly Retro (decision 27), item-less. A script computes the seven metrics from the
  tracker and the engine's items; the Retro agent reads the week's cases and the checkout
  and proposes rule, check and instruction changes, each with its linked cases, the file
  to change and the kind of change; a script files each as an item labelled
  `pipeline:retro` (idempotent), and the Operator gets one decision request with the seven
  numbers.

  Use when: its weekly timer binding starts it. NOT for: changing rules (the proposals go
  through Triage like any change).

inputs:
  repo_host:
    required: true
    description: The forge host of the repository.
  repo_path:
    required: true
    description: The owner/name path of the repository.
  since:
    default: "7d"
    description: The start of the window, as a duration back from now (7d, 2w) or an ISO date.

# The agent reads the checkout; nothing writes to it.
worktree: { enabled: false }
mutates_checkout: false

nodes:
  - id: metrics
    script: metrics
    runtime: bun
    output_format:
      type: object
      properties:
        week: { type: string }
        window: { type: object }
        # Not `metrics`: a script output's `metrics` field is the engine's metric records.
        numbers:
          type: object
          properties:
            operator_minutes_per_item: { type: [number, 'null'] }
            done_without_help: { type: [number, 'null'] }
            fix_rounds_to_green: { type: [number, 'null'] }
            prs_merged_share: { type: [number, 'null'] }
            rollbacks: { type: integer }
            cost_per_merged_change: { type: [number, 'null'] }
            follow_rate: { type: array, items: { type: object } }
          required: [operator_minutes_per_item, done_without_help, fix_rounds_to_green, prs_merged_share, rollbacks, cost_per_merged_change, follow_rate]
        counts: { type: object }
        cases: { type: array, items: { type: object } }
        notes: { type: array, items: { type: string } }
      required: [week, window, numbers, counts, cases, notes]

  - id: retro
    command: retro
    depends_on: [metrics]
    model: ['@retro', large]
    context: fresh
    mutates_checkout: false
    idle_timeout: 900000
    maxBudgetUsd: 5
    with:
      metrics: { from: "$metrics.output" }
    output_format:
      type: object
      additionalProperties: false
      properties:
        proposals:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              title: { type: string }
              kind: { type: string, enum: [check, instruction, remove-rule] }
              file: { type: string }
              change: { type: string }
              cases: { type: array, items: { type: string } }
              why: { type: string }
            required: [title, kind, file, change, cases, why]
        summary: { type: string }
      required: [proposals, summary]

  - id: file
    script: file
    runtime: bun
    depends_on: [metrics, retro]
    with:
      week: "$metrics.output.week"
      cases: { from: "$metrics.output.cases" }
      retro: { from: "$retro.output" }
    output_format:
      type: object
      properties:
        filed:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
            required: [key, title]
        dropped:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              why: { type: string }
            required: [title, why]
      required: [filed, dropped]

  - id: summary
    script: summary
    runtime: bun
    depends_on: [metrics, retro, file]
    with:
      week: "$metrics.output.week"
      metrics: { from: "$metrics.output.numbers" }
      counts: { from: "$metrics.output.counts" }
      notes: { from: "$metrics.output.notes" }
      filed: { from: "$file.output.filed" }
      dropped: { from: "$file.output.dropped" }
      summary: "$retro.output.summary"
    output_format:
      type: object
      properties:
        question: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              does: { type: string }
              value: { type: object }
            required: [id, label, does, value]
        recommendation:
          type: object
          properties:
            option: { type: string }
            why: { type: string }
            confidence: { type: string, enum: [low, medium, high] }
          required: [option, why, confidence]
        filed: { type: array, items: { type: string } }
      required: [question, options, recommendation, filed]

  - id: ask
    depends_on: [summary]
    wait:
      attention: "$summary.output.question"
      form: select
      options: "$summary.output.options"
      other: true
      recommendation: "$summary.output.recommendation"
      labels:
        gate: retro

  - id: ruling
    script: ruling
    runtime: bun
    depends_on: [metrics, summary, ask]
    with:
      week: "$metrics.output.week"
      filed: { from: "$summary.output.filed" }
      decision: "$ask.output.decision"
      text: "$ask.output.text"
      value: "$ask.output.value"

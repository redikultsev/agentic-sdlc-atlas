name: unify-round
description: |
  One implementation round of one work item (SPEC "Workflows", unify-round): checks
  that the item may start, that no other change already does it and that the base is
  green, implements the ready slices as child runs, joins them into `pipeline/<key>`, opens
  or updates the draft PR, then verifies it: CI, the guard against weakened checks, open
  review threads, the AI reviewer of another model family, and acceptance when the item
  has criteria. The round is recorded with the diff fingerprint and classified; the last
  node fires merge, the next round, or plan. Gates sit inside the run: a wait pauses it and
  the answer resumes it.

  Use when: a fire from triage (S), plan, merge ("changes", a land conflict or red), or
  this workflow itself starts it, on one item. Needs a git repository: the
  binding runs it in a worktree.
  NOT for: merging (unify-merge) or planning slices (unify-plan).

inputs:
  repo_host:
    description: The forge host of the item's repository.
  repo_path:
    description: The owner/name path of the item's repository.
  number:
    description: "The item's key: an issue number or a tracker key such as PROJ-123."
  unify_round_binding:
    default: ""
    description: Absolute path of the binding file that starts unify-round (this workflow).
  unify_plan_binding:
    default: ""
    description: Absolute path of the binding file that starts unify-plan.
  unify_merge_binding:
    default: ""
    description: Absolute path of the binding file that starts unify-merge.

nodes:
  # ---- start check -------------------------------------------------------------------
  - id: reconcile
    script: reconcile
    runtime: bun
    output_format: &card_result
      type: object
      properties:
        ok: { type: boolean }
        state: { type: string }
        problems: { type: array, items: { type: string } }
        ask: { type: boolean }
        question: { type: string }
        options: &options
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              does: { type: string }
              value: { type: object }
            required: [id, label, does, value]
        recommendation: { type: [object, 'null'] }
      required: [ok, state, problems, ask, question, options, recommendation]

  - id: reconcile-ask
    depends_on: [reconcile]
    when: "$reconcile.output.ask == 'true'"
    wait:
      attention: "$reconcile.output.question"
      form: select
      options: "$reconcile.output.options"
      other: true
      recommendation: "$reconcile.output.recommendation"
      labels: { gate: reconcile, stage: round, kind: reconcile, item: "$INPUTS.number" }

  - id: reconcile-ruling
    script: reconcile-ruling
    runtime: bun
    depends_on: [reconcile, reconcile-ask]
    trigger_rule: none_failed_min_one_success
    with:
      reconcile: { from: "$reconcile.output" }
      answer: { from: "$reconcile-ask.output", if_skipped: null }
    output_format:
      type: object
      properties: { go: { type: boolean } }
      required: [go]

  # ---- rounds, route, base -------------------------------------------------------------
  - id: rounds
    script: rounds
    runtime: bun
    depends_on: [reconcile-ruling]
    when: "$reconcile-ruling.output.go == 'true'"
    output_format:
      type: object
      properties:
        go: { type: boolean }
        at_cap: { type: boolean }
        rounds: { type: integer }
        ask: { type: boolean }
        question: { type: string }
        options: *options
        recommendation: { type: [object, 'null'] }
      required: [go, at_cap, rounds, ask, question, options, recommendation]

  - id: route
    script: route
    runtime: bun
    depends_on: [rounds]
    when: "$rounds.output.go == 'true'"
    output_format:
      type: object
      properties:
        hits: { type: array, items: { type: integer } }
        ask: { type: boolean }
        question: { type: string }
        options: *options
        recommendation: { type: [object, 'null'] }
      required: [hits, ask, question, options, recommendation]

  - id: route-ask
    depends_on: [route]
    when: "$route.output.ask == 'true'"
    wait:
      attention: "$route.output.question"
      form: select
      options: "$route.output.options"
      other: true
      recommendation: "$route.output.recommendation"
      labels: { gate: route, stage: round, kind: route, item: "$INPUTS.number" }

  - id: route-ruling
    script: route-ruling
    runtime: bun
    depends_on: [route, route-ask]
    trigger_rule: none_failed_min_one_success
    with:
      route: { from: "$route.output" }
      answer: { from: "$route-ask.output", if_skipped: null }
    output_format:
      type: object
      properties:
        mode: { type: string, enum: [implement, verify, stop] }
        pr: { type: [integer, 'null'] }
      required: [mode, pr]

  - id: base
    script: base
    runtime: bun
    depends_on: [route-ruling]
    when: "$route-ruling.output.mode != 'stop'"
    timeout: 7200000
    output_format:
      type: object
      properties:
        go: { type: boolean }
        commit: { type: string }
        failing: { type: array, items: { type: string } }
        fresh: { type: array, items: { type: string } }
        ask: { type: boolean }
        question: { type: string }
        options: *options
        recommendation: { type: [object, 'null'] }
      required: [go, commit, failing, fresh, ask, question, options, recommendation]

  - id: base-ask
    depends_on: [base]
    when: "$base.output.ask == 'true'"
    wait:
      attention: "$base.output.question"
      form: select
      options: "$base.output.options"
      other: true
      recommendation: "$base.output.recommendation"
      labels: { gate: red-base, stage: round, kind: red-base, item: "$INPUTS.number" }

  - id: base-ruling
    script: base-ruling
    runtime: bun
    depends_on: [base, base-ask]
    trigger_rule: none_failed_min_one_success
    with:
      base_check: { from: "$base.output" }
      answer: { from: "$base-ask.output", if_skipped: null }
    output_format:
      type: object
      properties: { go: { type: boolean } }
      required: [go]

  # ---- implement -----------------------------------------------------------------------
  - id: implementing
    script: implementing
    runtime: bun
    depends_on: [base-ruling, route-ruling]
    when: "$base-ruling.output.go == 'true'"
    with:
      route: { from: "$route-ruling.output" }
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        mode: { type: string, enum: [implement, verify] }
        branch: { type: string }
      required: [ok, mode, branch]

  - id: frontier
    script: frontier
    runtime: bun
    depends_on: [implementing]
    when: "$implementing.output.mode == 'implement'"
    output_format:
      type: object
      properties:
        slices:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              issue: { type: [integer, 'null'] }
              title: { type: string }
              brief: { type: string }
              branch: { type: string }
              item_branch: { type: string }
              base: { type: string }
              progress: { type: string }
              work_dir: { type: string }
              fix: { type: boolean }
            required: [id, issue, title, brief, branch, item_branch, base, progress, work_dir, fix]
        left: { type: integer }
        fix: { type: boolean }
      required: [slices, left, fix]

  # Each ready slice is a child run in its own worktree. The frontier already holds the
  # batch to the project's `slices.maxParallel` (default 1), so `all` opens that many.
  - id: slices
    workflow: unify-slice
    depends_on: [frontier]
    isolation: worktree
    fan_out:
      items: "$frontier.output.slices"
      as: slice
      max_parallel: all
    with:
      repo_host: "$INPUTS.repo_host"
      repo_path: "$INPUTS.repo_path"
      number: "$INPUTS.number"

  - id: join
    script: join
    runtime: bun
    depends_on: [frontier, slices]
    with:
      frontier: { from: "$frontier.output" }
      slices: { from: "$slices.output" }
    output_format:
      type: object
      properties:
        go: { type: boolean }
        outcome: { type: string, enum: [joined, conflict, failed, none] }
        pushed: { type: array, items: { type: string } }
        failed:
          type: array
          items:
            type: object
            properties: { id: { type: string }, reason: { type: string } }
            required: [id, reason]
        steps_skipped: { type: array, items: { type: string } }
        discoveries: { type: array, items: { type: object } }
        summaries: { type: array, items: { type: string } }
        head: { type: [string, 'null'] }
        # The item's new tests with their red records, every round so far (decision 58).
        tests: { type: array, items: { type: object } }
      required: [go, outcome, pushed, failed, steps_skipped, discoveries, summaries, head, tests]

  - id: push
    script: push
    runtime: bun
    depends_on: [join, implementing]
    when: "$join.output.go == 'true'"
    with:
      join: { from: "$join.output" }
      branch: "$implementing.output.branch"
    output_format:
      type: object
      properties: { branch: { type: string }, head: { type: string } }
      required: [branch, head]

  - id: publish
    script: publish
    runtime: bun
    depends_on: [push, join]
    with:
      push: { from: "$push.output" }
      join: { from: "$join.output" }
    output_format:
      type: object
      properties: { pr: { type: integer }, head: { type: string } }
      required: [pr, head]

  # ---- verify --------------------------------------------------------------------------
  # Runs after publish, or straight after Implementing in verify mode (a found PR).
  - id: verifying
    script: verifying
    runtime: bun
    depends_on: [implementing, route-ruling, join, publish]
    trigger_rule: none_failed_min_one_success
    with:
      route: { from: "$route-ruling.output" }
      implementing: { from: "$implementing.output", if_skipped: null }
      join: { from: "$join.output", if_skipped: null }
      publish: { from: "$publish.output", if_skipped: null }
    output_format:
      type: object
      properties:
        go: { type: boolean }
        pr: { type: integer }
        head: { type: string }
        branch: { type: string }
        fingerprint: { type: string }
        criteria: { type: array, items: { type: string } }
        has_criteria: { type: boolean }
        spec: { type: string }
      required: [go, pr, head, branch, fingerprint, criteria, has_criteria, spec]

  - id: ci
    script: ci
    runtime: bun
    depends_on: [verifying]
    when: "$verifying.output.go == 'true'"
    timeout: 7200000
    with:
      pr: "$verifying.output.pr"
      head: "$verifying.output.head"
    output_format:
      type: object
      properties:
        state: { type: string, enum: [green, red, timeout, none] }
        red: { type: array, items: { type: string } }
        discounted: { type: array, items: { type: string } }
        head: { type: string }
        source: { type: string }
      required: [state, red, discounted, head, source]

  - id: guard
    script: guard
    runtime: bun
    depends_on: [verifying]
    when: "$verifying.output.go == 'true'"
    with:
      head: "$verifying.output.head"
    output_format:
      type: object
      properties:
        flags: { type: array, items: { type: string } }
        head: { type: string }
      required: [flags, head]

  - id: threads
    script: threads
    runtime: bun
    depends_on: [verifying]
    when: "$verifying.output.go == 'true'"
    with:
      pr: "$verifying.output.pr"
    output_format:
      type: object
      properties:
        count: { type: integer }
        untrusted: { type: integer }
        threads: { type: array, items: { type: object } }
        text: { type: string }
      required: [count, untrusted, threads, text]

  - id: reviewer-ready
    script: reviewer-ready
    runtime: bun
    depends_on: [verifying]
    when: "$verifying.output.go == 'true'"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        review: { type: string }
        implementer: { type: string }
        ask: { type: boolean }
        question: { type: string }
        options: *options
        recommendation: { type: [object, 'null'] }
      required: [ready, review, implementer, ask, question, options, recommendation]

  - id: reviewer-ask
    depends_on: [reviewer-ready]
    when: "$reviewer-ready.output.ask == 'true'"
    wait:
      attention: "$reviewer-ready.output.question"
      form: select
      options: "$reviewer-ready.output.options"
      other: true
      recommendation: "$reviewer-ready.output.recommendation"
      labels: { gate: review-unavailable, stage: round, kind: review-unavailable, item: "$INPUTS.number" }

  # The AI reviewer: another model family than the Implementer, checked above. Runs on a
  # green (or check-less) CI only: red CI is already a fix round.
  - id: review
    command: review
    depends_on: [verifying, ci, guard, threads, reviewer-ready]
    when: "$reviewer-ready.output.ready == 'true' && $ci.output.state == 'green' || $reviewer-ready.output.ready == 'true' && $ci.output.state == 'none'"
    model: ['@review', large]
    idle_timeout: 900000
    mutates_checkout: false
    with:
      number: "$INPUTS.number"
      pr: "$verifying.output.pr"
      head: "$verifying.output.head"
      base: "$INPUTS.base"
      spec: "$verifying.output.spec"
      ci: { from: "$ci.output" }
      flags: { from: "$guard.output.flags" }
      threads: "$threads.output.text"
      # Red records of the new tests (decision 58); null when this round found a PR instead of building one.
      tests: { from: "$join.output.tests", if_skipped: null }
    output_format:
      type: object
      additionalProperties: false
      properties:
        verdict: { type: string, enum: [pass, fix, block] }
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string }
              file: { type: string }
              line: { type: [integer, 'null'] }
              claim: { type: string }
              evidence: { type: string }
              rechecked: { type: boolean }
              in_change: { type: boolean }
            required: [id, file, line, claim, evidence, rechecked, in_change]
        threads:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              thread: { type: string }
              confirmed: { type: boolean }
              in_change: { type: boolean }
              reply: { type: string }
            required: [thread, confirmed, in_change, reply]
        explanation:
          type: object
          additionalProperties: false
          properties:
            raw: { type: string }
            reading: { type: string }
          required: [raw, reading]
        discoveries: &discoveries
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              where: { type: string }
              what: { type: string }
              evidence: { type: string }
              # Null, or why it cannot wait for the daily pass: a vulnerability, data loss or broken production (decision 60).
              urgent: { type: [string, 'null'] }
            required: [where, what, evidence, urgent]
        summary: { type: string }
      required: [verdict, findings, threads, explanation, discoveries, summary]

  # Acceptance on the running app, only for items whose spec has criteria, and only after
  # a pass: review findings change code and would void a validation (decision 23).
  - id: validator
    command: validator
    depends_on: [verifying, review]
    when: "$review.output.verdict == 'pass' && $verifying.output.has_criteria == 'true'"
    model: ['@validator', large]
    idle_timeout: 900000
    maxBudgetUsd: 15
    with:
      number: "$INPUTS.number"
      pr: "$verifying.output.pr"
      head: "$verifying.output.head"
      spec: "$verifying.output.spec"
      criteria: { from: "$verifying.output.criteria" }
    output_format:
      type: object
      additionalProperties: false
      properties:
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string }
              result: { type: string, enum: [pass, fail] }
              check: { type: string }
              output: { type: string }
            required: [id, result, check, output]
        discoveries: *discoveries
        summary: { type: string }
      required: [criteria, discoveries, summary]

  # ---- record, Blocked, next -------------------------------------------------------------
  # all_done: a crashed or limit-stopped review or validator still ends the round here,
  # read from the node outcomes, and counts as a failed round.
  - id: round
    script: round
    runtime: bun
    depends_on: [rounds, route-ruling, join, verifying, ci, guard, threads, reviewer-ready, reviewer-ask, review, validator]
    trigger_rule: all_done
    with:
      rounds: { from: "$rounds.output", if_skipped: null }
      route: { from: "$route-ruling.output", if_skipped: null }
      join: { from: "$join.output", if_skipped: null }
      verifying: { from: "$verifying.output", if_skipped: null }
      ci: { from: "$ci.output", if_skipped: null }
      reviewer: { from: "$reviewer-ready.output", if_skipped: null }
      reviewer_answer: { from: "$reviewer-ask.output", if_skipped: null }
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [none, pass, continue, fix, retry, review-unavailable, blocked] }
        spent: { type: boolean }
        rounds: { type: integer }
        effect: { type: string }
        summary: { type: string }
        ask: { type: boolean }
        question: { type: string }
        options: *options
        recommendation: { type: [object, 'null'] }
      required: [outcome, spent, rounds, effect, summary, ask, question, options, recommendation]

  - id: blocked
    depends_on: [round]
    when: "$round.output.ask == 'true'"
    wait:
      attention: "$round.output.question"
      form: select
      options: "$round.output.options"
      other: true
      recommendation: "$round.output.recommendation"
      labels: { gate: blocked, stage: round, kind: blocked, item: "$INPUTS.number" }

  - id: next
    script: next
    runtime: bun
    depends_on: [round, blocked]
    trigger_rule: none_failed_min_one_success
    with:
      round: { from: "$round.output" }
      answer: { from: "$blocked.output", if_skipped: null }
    output_format:
      type: object
      properties: { did: { type: string } }
      required: [did]

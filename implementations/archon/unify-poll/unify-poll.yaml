name: unify-poll
description: |
  Intake for the agentic pipeline: every 300 seconds, the oldest open item that is new
  to the pipeline starts triage, unless three items already wait for the Operator.
  Item-less: it reconciles nothing and writes nothing on the item.

  Use when: the unify-poll schedule binding starts it.
  NOT for: triaging an item (unify-triage).

inputs:
  repo_host:
    default: ""
    description: The forge host of the repository the pipeline works.
  repo_path:
    default: ""
    description: The owner/name path of that repository.
  unify_triage_binding:
    default: ""
    description: Absolute path of the unify-triage binding file; the fire node starts triage through it.

worktree: { enabled: false }
mutates_checkout: false

nodes:
  - id: pick
    script: pick
    runtime: bun
    timeout: 120000
    output_format:
      type: object
      properties:
        found: { type: boolean }
        number: { type: string }
        delivery: { type: string }
        title: { type: string }
        passed: { type: integer }
      required: [found, number, delivery, title, passed]

  - id: cap
    script: cap
    runtime: bun
    timeout: 120000
    depends_on: [pick]
    when: "$pick.output.found == 'true'"
    output_format:
      type: object
      properties:
        go: { type: boolean }
        waiting: { type: integer }
        cap: { type: integer }
      required: [go, waiting, cap]

  - id: fire
    script: fire
    runtime: bun
    timeout: 120000
    depends_on: [pick, cap]
    when: "$cap.output.go == 'true'"
    with:
      number: "$pick.output.number"
      delivery: "$pick.output.delivery"
    output_format:
      type: object
      properties:
        fired: { type: string }
        disposition: { type: string }
      required: [fired, disposition]

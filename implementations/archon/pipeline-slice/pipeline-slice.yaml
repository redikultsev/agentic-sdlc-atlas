name: pipeline-slice
description: |
  One slice of a work item, as a child run of pipeline-round (SPEC "Workflows",
  pipeline-slice): a fresh Implementer session works the slice on its own branch, with a
  progress file on that branch so a later session continues from it, and a script commits,
  pushes and reads the branch back. It ends `pushed` or `failed(reason)`; it carries no item
  and fires nothing.

  Use when: pipeline-round fans out over its frontier.
  NOT for: starting by hand; run pipeline-round on the item instead.

inputs:
  repo_host:
    description: The forge host of the item's repository.
  repo_path:
    description: The owner/name path of the item's repository.
  number:
    description: The work item's issue number (the slice's parent).
  slice:
    required: true
    description: One slice from the round's frontier, as JSON.

returns: { node: commit, outcome: status }

nodes:
  - id: prepare
    script: prepare
    runtime: bun
    output_format:
      type: object
      properties:
        branch: { type: string }
        start: { type: string }
        continued: { type: boolean }
        progress: { type: string }
        has_progress: { type: boolean }
        brief: { type: string }
        id: { type: string }
      required: [branch, start, continued, progress, has_progress, brief, id]

  - id: implement
    command: implementer
    depends_on: [prepare]
    model: ['@implementer', large]
    context: fresh
    idle_timeout: 1200000
    maxBudgetUsd: 20
    with:
      number: "$INPUTS.number"
      branch: "$prepare.output.branch"
      progress: "$prepare.output.progress"
      continued: "$prepare.output.continued"
      brief: "$prepare.output.brief"
    output_format:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [done, failed, scope] }
        branch: { type: string }
        steps_skipped: { type: array, items: { type: string } }
        discoveries:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              where: { type: string }
              what: { type: string }
              evidence: { type: string }
            required: [where, what, evidence]
        scope_question: { type: [string, 'null'] }
        reason: { type: string }
        summary: { type: string }
      required: [status, branch, steps_skipped, discoveries, scope_question, reason, summary]

  - id: commit
    script: commit
    runtime: bun
    depends_on: [prepare, implement]
    with:
      prepare: { from: "$prepare.output" }
      implement: { from: "$implement.output" }
    output_format:
      type: object
      properties:
        status: { type: string, enum: [pushed, failed] }
        reason: { type: string }
        branch: { type: string }
        head: { type: [string, 'null'] }
        steps_skipped: { type: array, items: { type: string } }
        discoveries: { type: array, items: { type: object } }
        summary: { type: string }
      required: [status, reason, branch, head, steps_skipped, discoveries, summary]

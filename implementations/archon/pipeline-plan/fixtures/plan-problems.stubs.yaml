# The plan check finds a criterion no slice covers and a cycle: the card recommends redo.
reconcile: { ok: true, reason: "", question: "", options: [], recommendation: { option: "", why: "", confidence: low }, state: spec-review }
enter: { ok: true, reason: "", question: "", options: [], recommendation: { option: "", why: "", confidence: low }, go: true, ask: false }
gather: { context: "stub: item #7", spec: "# Spec for #7\n### AC1. stub\n### AC2. stub", criteria: [AC1, AC2], base_commit: "0123456789abcdef0123456789abcdef01234567", size: M }
check-refs: { ok: true, problems: [], checked: 0, research: "", url: "" }
prev-ruling: { go: true, over: false, mismatch: "", redo: 0, correction: "", rulings: "" }
planner:
  summary: "stub: two slices, the export endpoint first"
  slices:
    - { id: S1, title: "stub: export endpoint", files: [src/report/export.ts], risks: [], check: "bun test src/report", criteria: [AC1], blocked_by: [], changed_lines: 80 }
    - { id: S2, title: "stub: download button", files: [src/ui/report.tsx], risks: [], check: "bun test src/ui", criteria: [AC2], blocked_by: [S1], changed_lines: 40 }
check-plan:
  ok: true
  problems: []
  url: "https://github.com/example/repo/blob/abc1234/.pipeline/work/7/plan.md"
  slices:
    - { id: S1, title: "stub: export endpoint", files: [src/report/export.ts], risks: [], check: "bun test src/report", criteria: [AC1], blocked_by: [], changed_lines: 80 }
    - { id: S2, title: "stub: download button", files: [src/ui/report.tsx], risks: [], check: "bun test src/ui", criteria: [AC2], blocked_by: [S1], changed_lines: 40 }
review:
  ok: true
  reason: ""
  question: "stub: #7: approve this plan, or redo?"
  options:
    - { id: approve, label: "Approve the plan", does: "Creates the slices.", value: { effect: approve } }
    - { id: redo, label: "Send the problems back", does: "Runs the Planner again with the problems.", value: { effect: redo } }
  recommendation: { option: redo, why: "stub: 2 problems", confidence: high }
  over: false
  url: "https://github.com/example/repo/blob/abc1234/.pipeline/work/7/plan.md"
  slices: []
  problems: ["stub: criterion AC2 is covered by no slice", "stub: the blocked-by graph has a cycle through S1, S2"]
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo, number: "7", pipeline_round_binding: /bindings/pipeline-round.yaml }
  expect: paused
  reached: [check-plan, review]

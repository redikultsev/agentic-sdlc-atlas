name: unify-slice
description: |
  One slice of a work item, as a child run of unify-round (SPEC "Workflows",
  unify-slice): a fresh Implementer session works the slice on its own branch, with a
  progress file on that branch so a later session continues from it, and a script commits,
  pushes and reads the branch back. It ends `pushed` or `failed(reason)`; it carries no item
  and fires nothing.

  Use when: unify-round fans out over its frontier.
  NOT for: starting by hand; run unify-round on the item instead.

inputs:
  repo_host:
    description: The forge host of the item's repository.
  repo_path:
    description: The owner/name path of the item's repository.
  number:
    description: "The item's key: an issue number or a tracker key such as PROJ-123."
  slice:
    required: true
    description: One slice from the round's frontier, as JSON.

returns: { node: commit, outcome: status }

nodes:
  # The implementer agent's skills: the pack's for its role and the project's .pipeline/skills file (decision 67).
  - id: skills-implementer
    script: skills
    runtime: bun
    timeout: 120000
    with: { role: implementer }
    output_format:
      type: object
      properties:
        text: { type: string }
        pack: { type: array, items: { type: string } }
        project: { type: [string, 'null'] }
      required: [text, pack, project]

  - id: prepare
    script: prepare
    runtime: bun
    output_format:
      type: object
      properties:
        branch: { type: string }
        start: { type: string }
        continued: { type: boolean }
        progress: { type: string }
        has_progress: { type: boolean }
        brief: { type: string }
        id: { type: string }
      required: [branch, start, continued, progress, has_progress, brief, id]

  - id: implement
    command: implementer
    depends_on: [prepare, skills-implementer]
    model: ['@implementer', large]
    context: fresh
    idle_timeout: 1200000
    maxBudgetUsd: 20
    with:
      skills: "$skills-implementer.output.text"
      number: "$INPUTS.number"
      branch: "$prepare.output.branch"
      progress: "$prepare.output.progress"
      continued: "$prepare.output.continued"
      brief: "$prepare.output.brief"
    output_format:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [done, failed, scope] }
        branch: { type: string }
        # Red before green (decision 58): each new test with its failing output before the code, or why it has none.
        tests:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name: { type: string }
              file: { type: string }
              command: { type: string }
              red: { type: [string, 'null'] }
              why_no_red: { type: [string, 'null'] }
            required: [name, file, command, red, why_no_red]
        steps_skipped: { type: array, items: { type: string } }
        discoveries:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              where: { type: string }
              what: { type: string }
              evidence: { type: string }
              # Null, or why it cannot wait for the daily pass: a vulnerability, data loss or broken production (decision 60).
              urgent: { type: [string, 'null'] }
            required: [where, what, evidence, urgent]
        scope_question: { type: [string, 'null'] }
        reason: { type: string }
        summary: { type: string }
      required: [status, branch, tests, steps_skipped, discoveries, scope_question, reason, summary]

  - id: commit
    script: commit
    runtime: bun
    depends_on: [prepare, implement]
    with:
      prepare: { from: "$prepare.output" }
      implement: { from: "$implement.output" }
    output_format:
      type: object
      properties:
        status: { type: string, enum: [pushed, failed] }
        reason: { type: string }
        branch: { type: string }
        head: { type: [string, 'null'] }
        tests: { type: array, items: { type: object } }
        steps_skipped: { type: array, items: { type: string } }
        discoveries: { type: array, items: { type: object } }
        summary: { type: string }
      required: [status, reason, branch, head, tests, steps_skipped, discoveries, summary]

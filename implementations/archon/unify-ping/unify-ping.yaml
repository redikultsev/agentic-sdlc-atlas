name: unify-ping
description: |
  Install check for the unify-sdlc pack, run by hand. Ensures every state and
  pipeline label exists in the project's tracker, checks `gh api` access and the pipeline login,
  checks the binding files written by `archon pack bindings`, reports whether the AI
  reviewer can run on Codex, reads .pipeline/project.yaml (environments with their kind,
  stage and declared steps, the release trigger, toggles; shape A when no environments
  are declared; a parse error fails the check), reads the scouts it declares
  (each with its schedule, budget and cost cap, paths, findings waiting; a bad setting fails
  the check), and runs the project's test suite through the git and gh
  guard, reporting what the guard refused. Ends with one readable report.

  Use when: after installing or updating the pack, or after changing the guard, the token
  or the bindings. NOT for: working an item (every other pipeline-* workflow).

inputs:
  repo_host:
    default: ""
    description: The forge host of the repository; empty, with repo_path empty too, reads the checkout's origin remote.
  repo_path:
    default: ""
    description: The owner/name path of the repository.
  bindings_dir:
    default: ""
    description: The directory `archon pack bindings --out` wrote the binding files to; empty skips that check and says so.
  guard_dir:
    default: ""
    description: A directory holding the git and gh guard wrappers, put first on PATH for the test run; empty uses PATH as it is.

returns: { node: report, outcome: ok }

# Runs in the launch checkout: the test suite runs where the Operator's checkout is.
worktree: { enabled: false }

nodes:
  - id: repo
    script: repo
    runtime: bun
    output_format:
      type: object
      properties:
        host: { type: string }
        path: { type: string }
        source: { type: string }
      required: [host, path, source]

  - id: labels
    script: labels
    runtime: bun
    depends_on: [repo]
    with:
      host: "$repo.output.host"
      path: "$repo.output.path"

  - id: access
    script: access
    runtime: bun
    depends_on: [repo]
    with:
      host: "$repo.output.host"
      path: "$repo.output.path"

  - id: bindings
    script: bindings
    runtime: bun

  - id: codex
    script: codex
    runtime: bun

  - id: tests
    script: tests
    runtime: bun

  - id: deploys
    script: deploys
    runtime: bun
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        base: { type: string }
        error: { type: [string, 'null'] }
        legacy: { type: boolean }
        environments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string }
              stage: { type: string }
              steps: { type: array, items: { type: string } }
            required: [name, kind, stage, steps]
        trigger: { type: string }
        toggles: { type: [string, 'null'] }
      required: [ok, base, error, legacy, environments, trigger, toggles]

  - id: scouts
    script: scouts
    runtime: bun
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        base: { type: string }
        error: { type: [string, 'null'] }
        scouts:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              every: { type: string }
              budget: { type: number }
              cap: { type: number }
              paths: { type: array, items: { type: string } }
              measure: { type: integer }
              waiting: { type: integer }
              last: { type: [string, 'null'] }
            required: [name, every, budget, cap, paths, measure, waiting, last]
      required: [ok, base, error, scouts]

  - id: report
    script: report
    runtime: bun
    depends_on: [repo, labels, access, bindings, codex, tests, deploys, scouts]
    with:
      deploys: { from: "$deploys.output" }
      scouts: { from: "$scouts.output" }
      repo: { from: "$repo.output" }
      labels: { from: "$labels.output" }
      access: { from: "$access.output" }
      bindings: { from: "$bindings.output" }
      codex: { from: "$codex.output" }
      tests: { from: "$tests.output" }
    output_format:
      type: object
      properties:
        pack: { type: string }
        ok: { type: boolean }
        report: { type: string }
      required: [pack, ok, report]

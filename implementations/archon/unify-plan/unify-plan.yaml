name: unify-plan
description: |
  The plan stage of an approved spec (stage 3): Planning, codebase research for L items
  with every reference checked at the base commit, then up to three plans, each checked
  by script (criteria covered, no cycle, files and a check command per slice), committed
  as .pipeline/work/<n>/plan.md and put to the Operator at PlanReview. Approve creates the
  slice sub-issues with blocked-by links and starts the first implementation round.

  Use when: unify-spec fires it after the spec is approved.
  NOT for: implementing (unify-round).

inputs:
  repo_host:
    default: ""
    description: The forge host of the repository the pipeline works.
  repo_path:
    default: ""
    description: The owner/name path of that repository.
  number:
    required: true
    description: The issue number of the item.
  unify_round_binding:
    default: ""
    description: Absolute path of the unify-round binding file; slices starts the first round through it.

# Agents read the launch checkout; research and plan are committed to the item branch by
# plumbing, never through this checkout.
worktree: { enabled: false }
mutates_checkout: false

nodes:
  - id: reconcile
    script: reconcile
    runtime: bun
    timeout: 120000
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        reason: { type: string }
        question: { type: string }
        options: &options
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              does: { type: string }
              value: { type: object }
            required: [id, label, does, value]
        recommendation: &recommendation
          type: object
          properties:
            option: { type: string }
            why: { type: string }
            confidence: { type: string, enum: [low, medium, high] }
          required: [option, why, confidence]
        state: { type: string }
      required: [ok, reason, question, options, recommendation, state]

  # SPEC's "state Planning", joined with reconcile so one stop request covers both.
  - id: enter
    script: enter
    runtime: bun
    timeout: 120000
    depends_on: [reconcile]
    with:
      reconcile: { from: "$reconcile.output" }
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        reason: { type: string }
        question: { type: string }
        options: *options
        recommendation: *recommendation
        go: { type: boolean }
        ask: { type: boolean }
      required: [ok, reason, question, options, recommendation, go, ask]

  - id: stop
    depends_on: [enter]
    when: "$enter.output.ask == 'true'"
    wait:
      attention: "$enter.output.question"
      form: select
      options: "$enter.output.options"
      recommendation: "$enter.output.recommendation"
      other: true
      labels: { gate: stop, stage: plan, item: "$INPUTS.number" }

  # The answer to a difference with the tracker (decision 45): put the tracker back, or
  # adopt its state. The run ends either way.
  - id: sync
    script: sync
    runtime: bun
    timeout: 120000
    depends_on: [stop]
    when: "$stop.output.decision == 'tracker-back' || $stop.output.decision == 'adopt'"
    with:
      answer: { from: "$stop.output" }
    output_format:
      type: object
      properties:
        state: { type: string }
      required: [state]

  - id: gather
    script: gather
    runtime: bun
    timeout: 300000
    depends_on: [enter, stop]
    trigger_rule: none_failed_min_one_success
    when: "$enter.output.go == 'true'"
    output_format:
      type: object
      properties:
        context: { type: string }
        spec: { type: string }
        criteria: { type: array, items: { type: string } }
        base_commit: { type: string }
        size: { type: string }
      required: [context, spec, criteria, base_commit, size]

  # L items only: research first.
  - id: researcher
    command: researcher
    depends_on: [gather]
    when: "$gather.output.size == 'L'"
    model: ['@researcher', large]
    context: fresh
    idle_timeout: 900000
    maxBudgetUsd: 5
    with:
      context: "$gather.output.context"
      spec: "$gather.output.spec"
      base_commit: "$gather.output.base_commit"
    output_format:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string }
        modules:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path: { type: string }
              role: { type: string }
              claims: &claims
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    statement: { type: string }
                    file_line: { type: string }
                    quote: { type: string }
                  required: [statement, file_line, quote]
            required: [path, role, claims]
        invariants: *claims
      required: [summary, modules, invariants]

  - id: check-refs
    script: check-refs
    runtime: bun
    timeout: 300000
    depends_on: [gather, researcher]
    trigger_rule: none_failed_min_one_success
    with:
      research: { from: "$researcher.output", if_skipped: null }
      base_commit: "$gather.output.base_commit"
    output_format:
      type: object
      properties:
        ok: { type: boolean }
        problems: { type: array, items: { type: string } }
        checked: { type: integer }
        research: { type: string }
        url: { type: string }
      required: [ok, problems, checked, research, url]

  # At most three plans. The PlanReview gate is the body's only sink; "other" or the
  # declared redo runs another round, anything else ends the loop.
  - id: rounds
    depends_on: [check-refs]
    loop_group:
      max_iterations: 4
      until_bash: 'd=$plan-gate.output.decision; [ "$d" != other ] && [ "$d" != redo ]'
      nodes:
        - id: prev-ruling
          script: prev-ruling
          runtime: bun
          timeout: 120000
          with:
            prev_decision: "$LOOP_PREV.plan-gate.output.decision"
            prev_text: "$LOOP_PREV.plan-gate.output.text"
            prev_problems: "$LOOP_PREV.review.output.problems"
          output_format:
            type: object
            properties:
              go: { type: boolean }
              over: { type: boolean }
              mismatch: { type: string }
              redo: { type: integer }
              correction: { type: string }
              rulings: { type: string }
            required: [go, over, mismatch, redo, correction, rulings]

        - id: planner
          command: planner
          depends_on: [prev-ruling]
          when: "$prev-ruling.output.go == 'true'"
          model: ['@planner', large]
          context: fresh
          idle_timeout: 900000
          maxBudgetUsd: 5
          with:
            context: "$gather.output.context"
            spec: "$gather.output.spec"
            research: "$check-refs.output.research"
            rulings: "$prev-ruling.output.rulings"
            correction: "$prev-ruling.output.correction"
            previous: "$LOOP_PREV.planner.output"
          output_format:
            type: object
            additionalProperties: false
            properties:
              summary: { type: string }
              slices:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string }
                    title: { type: string }
                    files: { type: array, items: { type: string } }
                    risks: { type: array, items: { type: string } }
                    check: { type: string }
                    criteria: { type: array, items: { type: string } }
                    blocked_by: { type: array, items: { type: string } }
                    changed_lines: { type: integer }
                  required: [id, title, files, risks, check, criteria, blocked_by, changed_lines]
            required: [summary, slices]

        - id: check-plan
          script: check-plan
          runtime: bun
          timeout: 300000
          depends_on: [planner]
          with:
            plan: "$planner.output"
            criteria: "$gather.output.criteria"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              problems: { type: array, items: { type: string } }
              url: { type: string }
              slices: &slices { type: array, items: { type: object } }
            required: [ok, problems, url, slices]

        # SPEC's "state PlanReview": the move and the request.
        - id: review
          script: card
          runtime: bun
          timeout: 120000
          depends_on: [prev-ruling, check-plan]
          trigger_rule: none_failed_min_one_success
          with:
            round: { from: "$prev-ruling.output" }
            plan: { from: "$check-plan.output", if_skipped: null }
            research: "$check-refs.output"
          output_format:
            type: object
            properties:
              ok: { type: boolean }
              reason: { type: string }
              question: { type: string }
              options: *options
              recommendation: *recommendation
              over: { type: boolean }
              url: { type: string }
              slices: *slices
              problems: { type: array, items: { type: string } }
            required: [ok, reason, question, options, recommendation, over, url, slices, problems]

        - id: plan-gate
          depends_on: [review]
          wait:
            attention: "$review.output.question"
            form: select
            options: "$review.output.options"
            recommendation: "$review.output.recommendation"
            other: true
            labels: { gate: plan-review, stage: plan, item: "$INPUTS.number" }

  - id: slices
    script: slices
    runtime: bun
    timeout: 600000
    depends_on: [rounds]
    with:
      card: "$rounds.output"
    output_format:
      type: object
      properties:
        effect: { type: string, enum: [approve, stop] }
        slices:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              issue: { type: integer }
            required: [id, issue]
        fired: { type: string }
        summary: { type: string }
      required: [effect, slices, fired, summary]

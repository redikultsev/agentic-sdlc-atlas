# After a third redo no fourth plan is written: approve as is or stop; the Operator stops.
reconcile: { ok: true, reason: "", question: "", options: [], recommendation: { option: "", why: "", confidence: low }, state: spec-review }
enter: { ok: true, reason: "", question: "", options: [], recommendation: { option: "", why: "", confidence: low }, go: true, ask: false }
gather: { context: "stub: item #7", spec: "# Spec for #7\n### AC1. stub\n### AC2. stub", criteria: [AC1, AC2], base_commit: "0123456789abcdef0123456789abcdef01234567", size: M }
check-refs: { ok: true, problems: [], checked: 0, research: "", url: "" }
prev-ruling: { go: false, over: true, mismatch: "", redo: 3, correction: "stub: still too coarse", rulings: "" }
review:
  ok: true
  reason: ""
  question: "stub: #7: three redo rounds are used."
  options:
    - { id: approve, label: "Approve the last plan as it is", does: "Creates the slices.", value: { effect: approve } }
    - { id: stop, label: "Stop here", does: "Ends this run.", value: { effect: stop } }
  recommendation: { option: stop, why: "stub", confidence: medium }
  over: true
  url: "https://github.com/example/repo/tree/pipeline/7/.pipeline/work/7"
  slices: []
  problems: []
plan-gate: { decision: stop, text: "", value: { effect: stop } }
slices: { effect: stop, slices: [], fired: "", summary: "stub: #7: stop" }
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo, number: "7", unify_round_binding: /bindings/unify-round.yaml }
  expect: completed
  reached: [prev-ruling, review, slices]
